[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SITE_ROOT = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/resort"
  to = "/resort/"
  status = 301

[[redirects]]
  from = "/safari"
  to = "/safari/"
  status = 301

[[redirects]]
  from = "/reserve"
  to = "/reserve/"
  status = 301

[[redirects]]
  from = "/nearby"
  to = "/nearby/"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
